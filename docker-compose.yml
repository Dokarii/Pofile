# Contenedor de n8n 
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  # Microservicio: yt-dlp + ffmpeg + Flask
  downloader:
    build: ./downloader
    container_name: tiktok-downloader
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./downloads:/downloads
      - ./config:/config:ro

volumes:
  n8n_data:
